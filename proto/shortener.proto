syntax = "proto3";

package shortener;

option go_package = "github.com/bissquit/url-shortener/proto";

import "google/protobuf/empty.proto";

service ShortenerService {
  rpc ShortenURL (URLShortenRequest) returns (URLShortenResponse); // = CreateJSON
  rpc ExpandURL (URLExpandRequest) returns (URLExpandResponse); // = Redirect
  rpc ListUserURLs (google.protobuf.Empty) returns (UserURLsResponse); // = GetUserURLs
}

message URLShortenRequest {
  string url = 1;
}

message URLShortenResponse {
  string result = 1;
}

message URLExpandRequest {
  string id = 1;
}

message URLExpandResponse {
  string result = 1;
}

message UserURLsResponse {
  repeated URLData url = 1;
}

message URLData {
  string short_url = 1;
  string original_url = 2;
}
